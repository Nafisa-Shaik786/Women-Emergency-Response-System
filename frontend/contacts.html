<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Close Contacts</title>

    <link rel="stylesheet"
          href="css/style.css">

    <style>
        .contact-card {
            position: relative;
            width: 100%;
            cursor: pointer;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .contact-name {
            font-size: 18px;
            font-weight: 600;
        }

        .contact-details {
            font-size: 13px;
            opacity: 0.75;
        }

        .contact-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .edit-btn {
            background: #e8d9ff;
            color: #5c2d91;
        }

        .delete-btn {
            background: #ffdede;
            color: #b00020;
        }

        .contact-message {
            text-align: center;
            margin: 15px 0;
            font-size: 14px;
        }

        .loading-message {
            text-align: center;
            padding: 20px;
            font-size: 15px;
        }
    </style>

</head>

<body>

<div class="app">

    <header class="page-header">

        <button
            class="back-button"
            onclick="goToPage('index.html')">

            ←

        </button>


        <h1>
            Close Contacts
        </h1>


        <div class="profile-avatar">
            👩🏻
        </div>

    </header>


    <main class="contacts-page">

        <div id="contactMessage"
             class="contact-message">
        </div>

        <div id="contactsList">

            <div class="loading-message">
                Loading contacts...
            </div>

        </div>


        <button
            class="contact-card add-contact"
            id="addContactButton">

            +

        </button>

    </main>


    <nav class="bottom-navigation">

        <button
            class="nav-item"
            onclick="goToPage('index.html')">

            <span class="nav-icon">⌂</span>
            <span>Home</span>

        </button>


        <button
            class="nav-item"
            onclick="goToPage('videos.html')">

            <span class="nav-icon">▶</span>
            <span>Videos</span>

        </button>


        <button
            class="nav-item active">

            <span class="nav-icon">☎</span>
            <span>Contacts</span>

        </button>


        <button
            class="nav-item"
            onclick="goToPage('settings.html')">

            <span class="nav-icon">⚙</span>
            <span>Settings</span>

        </button>

    </nav>

</div>


<script src="js/script.js"></script>


<script>

const API_URL = "http://localhost:5000/api/contacts";

const contactsList = document.getElementById("contactsList");

const contactMessage =
    document.getElementById("contactMessage");

const addContactButton =
    document.getElementById("addContactButton");


/* --------------------------------
   Show Message
-------------------------------- */

function showMessage(message, success = true) {

    contactMessage.textContent = message;

    contactMessage.style.color =
        success ? "green" : "red";

    setTimeout(() => {
        contactMessage.textContent = "";
    }, 2500);
}


/* --------------------------------
   Load Contacts
-------------------------------- */

async function loadContacts() {

    try {

        const response = await fetch(API_URL);

        const data = await response.json();

        if (!data.success) {

            contactsList.innerHTML =
                "<p>Unable to load contacts.</p>";

            return;
        }

        displayContacts(data.contacts);

    }

    catch (error) {

        console.error("Error loading contacts:", error);

        contactsList.innerHTML = `
            <p class="loading-message">
                Unable to connect to backend.
                Make sure the server is running.
            </p>
        `;
    }
}


/* --------------------------------
   Display Contacts
-------------------------------- */

function displayContacts(contacts) {

    contactsList.innerHTML = "";

    if (contacts.length === 0) {

        contactsList.innerHTML = `
            <p class="loading-message">
                No contacts added yet.
            </p>
        `;

        return;
    }


    contacts.forEach(contact => {

        const card = document.createElement("div");

        card.className = "contact-card";


        card.innerHTML = `

            <div class="contact-info">

                <div class="contact-name">
                    ${contact.name}
                </div>

                <div class="contact-details">
                    ${contact.relationship}
                </div>

                <div class="contact-details">
                    ${contact.phone}
                </div>

                <div class="contact-actions">

                    <button
                        class="edit-btn"
                        onclick="editContact(${contact.id})">

                        Edit

                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteContact(${contact.id})">

                        Delete

                    </button>

                </div>

            </div>
        `;


        contactsList.appendChild(card);

    });
}


/* --------------------------------
   Add Contact
-------------------------------- */

addContactButton.addEventListener(
    "click",
    async function() {

        const name = prompt(
            "Enter contact name:"
        );

        if (!name) {
            return;
        }


        const phone = prompt(
            "Enter phone number:"
        );

        if (!phone) {
            return;
        }


        const relationship = prompt(
            "Enter relationship:"
        );

        if (!relationship) {
            return;
        }


        try {

            const response = await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        phone: phone,
                        relationship:
                            relationship
                    })
                }
            );


            const data =
                await response.json();


            if (data.success) {

                showMessage(
                    "Contact added successfully!"
                );

                loadContacts();

            }

            else {

                showMessage(
                    data.message,
                    false
                );

            }

        }

        catch (error) {

            console.error(
                "Add contact error:",
                error
            );

            showMessage(
                "Unable to connect to server.",
                false
            );
        }

    }
);


/* --------------------------------
   Edit Contact
-------------------------------- */

async function editContact(id) {

    const name = prompt(
        "Enter new contact name:"
    );

    if (!name) {
        return;
    }


    const phone = prompt(
        "Enter new phone number:"
    );

    if (!phone) {
        return;
    }


    const relationship = prompt(
        "Enter new relationship:"
    );

    if (!relationship) {
        return;
    }


    try {

        const response = await fetch(
            `${API_URL}/${id}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    name,
                    phone,
                    relationship
                })
            }
        );


        const data =
            await response.json();


        if (data.success) {

            showMessage(
                "Contact updated successfully!"
            );

            loadContacts();

        }

        else {

            showMessage(
                data.message,
                false
            );

        }

    }

    catch (error) {

        console.error(
            "Edit contact error:",
            error
        );

        showMessage(
            "Unable to connect to server.",
            false
        );
    }
}


/* --------------------------------
   Delete Contact
-------------------------------- */

async function deleteContact(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this contact?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response = await fetch(
            `${API_URL}/${id}`,
            {
                method: "DELETE"
            }
        );


        const data =
            await response.json();


        if (data.success) {

            showMessage(
                "Contact deleted successfully!"
            );

            loadContacts();

        }

        else {

            showMessage(
                data.message,
                false
            );

        }

    }

    catch (error) {

        console.error(
            "Delete contact error:",
            error
        );

        showMessage(
            "Unable to connect to server.",
            false
        );
    }
}


/* --------------------------------
   Load contacts when page opens
-------------------------------- */

loadContacts();

</script>

</body>

</html>
