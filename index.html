<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Women Safety - Home</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="location-section">

            <p class="location-label">
                Current location
            </p>

            <div class="location">
                <span class="location-pin">●</span>
                <span>Nagpur, Maharashtra</span>
            </div>

        </div>

        <div class="profile-avatar"
             onclick="goToPage('profile.html')">
            👩🏻
        </div>

    </header>


    <!-- MAIN -->
    <main class="main">

        <!-- LOW -->
        <div id="lowStatus"
             class="safety-card low-status">

            LOW

        </div>


        <!-- HIGH -->
        <div id="highStatus"
             class="safety-card high-status">

            HIGH

        </div>


        <!-- STATUS BUTTONS -->
        <div class="status-buttons">

            <button
                id="lowButton"
                class="status-button low-button">

                LOW

            </button>


            <button
                id="highButton"
                class="status-button high-button">

                HIGH

            </button>

        </div>


        <!-- EMERGENCY CONTACT INFORMATION -->
        <section class="emergency-information">

            <p>
                HELPLINE NUMBER :
                <strong>8888888888</strong>
            </p>

            <p>
                AMBULANCE :
                <strong>5556565656</strong>
            </p>

            <p>
                SECURITY ASSISTANCE :
                <strong>4546546521</strong>
            </p>

        </section>


        <!-- SOS -->
        <button
            id="protectButton"
            class="protect-button">

            PROTECT ME NOW

        </button>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-navigation">

        <button
            class="nav-item active"
            onclick="goToPage('index.html')">

            <span class="nav-icon">⌂</span>
            <span>Home</span>

        </button>


        <button
            class="nav-item"
            onclick="goToPage('videos.html')">

            <span class="nav-icon">▶</span>
            <span>Videos</span>

        </button>


        <button
            class="nav-item"
            onclick="goToPage('contacts.html')">

            <span class="nav-icon">☎</span>
            <span>Contacts</span>

        </button>


        <button
            class="nav-item"
            onclick="goToPage('settings.html')">

            <span class="nav-icon">⚙</span>
            <span>Settings</span>

        </button>

    </nav>

</div>


<script src="js/script.js"></script>

</body>

</html>
