<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="app">

    <header class="header">

        <div class="location-section">

            <p class="location-label">
                Current location
            </p>

            <div class="location">
                <span class="location-pin">●</span>
                <span>Nagpur, Maharashtra</span>
            </div>

        </div>

        <div class="profile-avatar">
            👩🏻
        </div>

    </header>


    <main class="auth-page">

        <h1 class="auth-title">
            SIGN UP
        </h1>


        <input
            class="input"
            placeholder="Enter your full name">


        <input
            type="email"
            class="input"
            placeholder="Enter your email">


        <input
            class="input"
            placeholder="Enter your Aadhaar number">


        <input
            type="password"
            class="input"
            placeholder="Enter password">


        <input
            type="password"
            class="input"
            placeholder="Confirm password">


        <button class="auth-button">
            Register
        </button>


        <p class="auth-text">

            Already have an account?

            <span
                class="link"
                onclick="goToPage('login.html')">

                Log in

            </span>

        </p>

    </main>

</div>

<script src="js/script.js"></script>

</body>

</html>
