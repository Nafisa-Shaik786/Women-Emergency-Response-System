<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="app">

    <header class="header">

        <div class="location-section">

            <p class="location-label">
                Current location
            </p>

            <div class="location">
                <span class="location-pin">●</span>
                <span>Nagpur, Maharashtra</span>
            </div>

        </div>

        <div class="profile-avatar">
            👩🏻
        </div>

    </header>


    <main class="auth-page">

        <h1 class="auth-title">
            LOGIN
        </h1>


        <input
            type="email"
            class="input"
            placeholder="Enter your email">


        <input
            type="password"
            class="input"
            placeholder="Enter password">


        <button class="auth-button">
            Login
        </button>


        <p class="auth-text">
            Forgot password?
            <span class="link">
                Get help
            </span>
        </p>


        <p class="auth-text">
            Don't have an account?
            <span
                class="link"
                onclick="goToPage('signup.html')">

                Sign Up

            </span>
        </p>

    </main>

</div>

<script src="js/script.js"></script>

</body>

</html>
