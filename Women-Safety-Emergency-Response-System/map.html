<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Location</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="app">

    <header class="header">

        <div class="location-section">

            <p class="location-label">
                Current location
            </p>

            <div class="location">
                <span class="location-pin">●</span>
                <span>Nagpur, Maharashtra</span>
            </div>

        </div>

        <div class="profile-avatar">
            👩🏻
        </div>

    </header>


    <main class="map-page">

        <div class="map">

            <div class="park park-one"></div>

            <div class="park park-two"></div>


            <div class="map-marker mom-marker">

                <span>Mom</span>
                <b>👩🏻</b>

            </div>


            <div class="map-marker you-marker">

                <span>You</span>
                <b>👩🏻</b>

            </div>


            <div class="map-controls">

                <button>
                    ⌖
                </button>

                <button>
                    ⛶
                </button>

            </div>

        </div>

    </main>


    <nav class="bottom-navigation">

        <button
            class="nav-item"
            onclick="goToPage('index.html')">

            <span class="nav-icon">⌂</span>
            <span>Home</span>

        </button>


        <button
            class="nav-item"
            onclick="goToPage('videos.html')">

            <span class="nav-icon">▶</span>
            <span>Videos</span>

        </button>


        <button
            class="nav-item"
            onclick="goToPage('contacts.html')">

            <span class="nav-icon">☎</span>
            <span>Contacts</span>

        </button>


        <button
            class="nav-item"
            onclick="goToPage('settings.html')">

            <span class="nav-icon">⚙</span>
            <span>Settings</span>

        </button>

    </nav>

</div>

<script src="js/script.js"></script>

</body>

</html>
