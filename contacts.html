<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Close Contacts</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="app">

    <header class="page-header">

        <button
            class="back-button"
            onclick="goToPage('index.html')">

            ←

        </button>


        <h1>
            Close Contacts
        </h1>


        <div class="profile-avatar">
            👩🏻
        </div>

    </header>


    <main class="contacts-page">

        <button class="contact-card">
            Mom
        </button>


        <button class="contact-card">
            Dad
        </button>


        <button class="contact-card">
            Sister
        </button>


        <button class="contact-card">
            Brother
        </button>


        <button class="contact-card">
            Mentor
        </button>


        <button class="contact-card">
            Warden
        </button>


        <button class="contact-card">
            Friend
        </button>


        <button class="contact-card add-contact">
            +
        </button>

    </main>


    <nav class="bottom-navigation">

        <button
            class="nav-item"
            onclick="goToPage('index.html')">

            <span class="nav-icon">⌂</span>
            <span>Home</span>

        </button>


        <button
            class="nav-item"
            onclick="goToPage('videos.html')">

            <span class="nav-icon">▶</span>
            <span>Videos</span>

        </button>


        <button
            class="nav-item active">

            <span class="nav-icon">☎</span>
            <span>Contacts</span>

        </button>


        <button
            class="nav-item"
            onclick="goToPage('settings.html')">

            <span class="nav-icon">⚙</span>
            <span>Settings</span>

        </button>

    </nav>

</div>

<script src="js/script.js"></script>

</body>

</html>
